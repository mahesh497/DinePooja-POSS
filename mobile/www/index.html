<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <title>DinePooja POS</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0f766e, #134e4a 55%, #0f172a);
        color: #ecfdf5;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        opacity: 0.85;
        max-width: 28rem;
        line-height: 1.45;
      }
      code {
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>DinePooja POS</h1>
      <p>
        Native shell is ready. Start the POS server on your PC
        (<code>npm run start:mobile</code>) and rebuild/sync the app so it can
        reach your LAN address.
      </p>
    </div>
  </body>
</html>
